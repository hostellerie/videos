name: Build installable Videos archive

on:
  workflow_dispatch:
  push:
    branches:
      - 0.19.0
      - 0.20.0
    paths-ignore:
      - 'dist/**'

concurrency:
  group: videos-build-dist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Synchronize branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Validate admin UI and language architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'function VIDEOS_adminNavigation($active)' functions.inc
          grep -Fq 'function VIDEOS_adminPageOpen($active, $pageTitle)' functions.inc
          grep -Fq 'function VIDEOS_adminPageClose()' functions.inc
          grep -Fq 'VIDEOS ADMIN UNIFIED UI 0.19.0' public_html/css/admin.css
          for file in admin/index.php admin/actions.php admin/stats.php admin/moderation.php; do
            grep -Fq 'VIDEOS_adminPageOpen(' "$file"
            grep -Fq 'VIDEOS_adminPageClose()' "$file"
            grep -Fq '$LANG_VIDEOS[' "$file"
          done
          if grep -R -nF '{{videos_admin_' admin; then
            echo 'Unresolved Videos admin language token found.' >&2
            exit 1
          fi
          if grep -R -nE 'videos_(overview_nav|admin_section_nav|stats_nav|moderation_nav)\(' admin; then
            echo 'Legacy per-page navigation helper found.' >&2
            exit 1
          fi
          if grep -R -nE "text_[0-9a-f]{12}|VIDEOS_adminText\(|VIDEOS_localizeAdminText\(" \
              admin/index.php admin/actions.php admin/stats.php admin/moderation.php functions.inc; then
            echo 'Legacy hashed admin language reference remains.' >&2
            exit 1
          fi
          if grep -R -nE 'LANG_VIDEOS_ADMIN(_TEXT)?|text_[0-9a-f]{12}' \
              language/english.php language/french_france.php; then
            echo 'Legacy admin language table remains.' >&2
            exit 1
          fi

      - name: Validate semantic admin language keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          admin_files = [Path('admin/index.php'), Path('admin/actions.php'), Path('admin/stats.php'), Path('admin/moderation.php')]
          lang_files = [Path('language/english.php'), Path('language/french_france.php')]
          used = set()
          for path in admin_files:
              used.update(re.findall(r"\$LANG_VIDEOS\['(admin_[A-Za-z0-9_]+)'\]", path.read_text(encoding='utf-8')))
          if not used:
              raise SystemExit('No semantic admin language keys found.')
          for path in lang_files:
              text = path.read_text(encoding='utf-8')
              defined = set(re.findall(r"\$LANG_VIDEOS\['(admin_[A-Za-z0-9_]+)'\]\s*=", text))
              defined.update(re.findall(r"'(admin_[A-Za-z0-9_]+)'\s*=>", text))
              missing = sorted(used - defined)
              if missing:
                  raise SystemExit(f'{path}: missing semantic admin keys: {", ".join(missing)}')
          print(f'Validated {len(used)} semantic admin language keys in English and French.')
          PY

      - name: Validate storage upgrade
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'public function migrateLegacyStorage()' classes/Videos_Bootstrap.php
          grep -Fq 'private function selectRuntimeRoot(' classes/Videos_Bootstrap.php
          grep -Fq '$bootstrap->migrateLegacyStorage()' install_updates.php
          grep -Fq 'Legacy data was preserved.' install_updates.php
          if grep -Fq '$this->migrateLegacyData($this->legacyDataRoot' classes/Videos_Bootstrap.php; then
            echo 'Runtime bootstrap still performs implicit storage migration.' >&2
            exit 1
          fi

      - name: Validate lifecycle events
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '$this->signalDeleted($videoId);' classes/Videos_PermanentPool.php
          grep -Fq 'foreach ($previousItems as $videoId => $item)' classes/Videos_PermanentPool.php
          grep -Fq '$this->signalChannelVideos($channelId, $afterExcluded);' classes/Videos_Moderation.php
          grep -Fq "function_exists('PLG_itemDeleted')" classes/Videos_Moderation.php
          grep -Fq "function_exists('PLG_itemDeleted')" classes/Videos_PermanentPool.php

      - name: Validate native integrations
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "require_once __DIR__ . '/geeklog_integration.php';" functions.inc
          grep -Fq "require_once __DIR__ . '/interoperability.php';" functions.inc
          grep -Fq 'function plugin_getfeednames_videos()' interoperability.php
          grep -Fq 'function plugin_getfeedcontent_videos(' interoperability.php
          grep -Fq "'config.videos.tab_seo'" autoinstall.php
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('autoinstall.php').read_text(encoding='utf-8')
          install = text.split('$features = array(', 1)[1].split(');', 1)[0]
          uninstall = text.split("'features' => array(", 1)[1].split(')', 1)[0]
          installed = set(re.findall(r"'((?:videos|config\.videos)\.[^']+)'", install))
          removed = set(re.findall(r"'((?:videos|config\.videos)\.[^']+)'", uninstall))
          missing = sorted(installed - removed)
          if missing:
              raise SystemExit('Uninstall misses features: ' + ', '.join(missing))
          print(f'Validated uninstall symmetry for {len(installed)} features.')
          PY

      - name: Validate 0.20 architecture
        if: github.ref_name == '0.20.0'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "require_once __DIR__ . '/feed_update.php';" version.php
          grep -Fq 'function plugin_feedupdatecheck_videos(' feed_update.php
          grep -Fq 'class Videos_ProviderFactory' classes/Videos_ProviderFactory.php
          grep -Fq 'class Videos_TemplateRenderer' classes/Videos_TemplateRenderer.php
          grep -Fq 'class Videos_CatalogueRenderer' classes/Videos_CatalogueRenderer.php
          grep -Fq 'new Videos_CatalogueRenderer(' public_html/index.php
          test -s templates/default/catalogue.thtml
          test -s templates/default/video-card.thtml
          grep -Fq '{grid}' templates/default/catalogue.thtml
          php tools/test-provider-contract.php
          php tools/test-public-local-only.php
          php tools/test-integration-load.php
          php tools/test-capability-contract.php

      - name: Lint PHP sources
        id: lint
        shell: bash
        run: |
          set +e
          : > lint-report.txt
          status=0
          while IFS= read -r -d '' file; do
            output=$(php -l "$file" 2>&1)
            code=$?
            if [ "$code" -ne 0 ]; then
              status=1
              printf '%s\n%s\n\n' "$file" "$output" >> lint-report.txt
            fi
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -not -path './.git/*' -not -path './dist/*' -print0)
          if [ "$status" -ne 0 ]; then
            cat lint-report.txt
            exit 1
          fi
          rm -f lint-report.txt

      - name: Upload lint diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: videos-lint-report
          path: lint-report.txt
          if-no-files-found: ignore

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*define('VIDEOS_PLUGIN_VERSION', '\([^']*\)').*/\1/p" version.php | head -n 1)
          MIN_GL=$(sed -n "s/.*define('VIDEOS_MIN_GEEKLOG_VERSION', '\([^']*\)').*/\1/p" version.php | head -n 1)
          if [ -z "$VERSION" ] || [ -z "$MIN_GL" ]; then
            echo 'Unable to determine Videos version or minimum Geeklog version.' >&2
            exit 1
          fi
          ARCHIVE="videos_${VERSION}_${MIN_GL}.zip"
          rm -rf build
          mkdir -p build/videos dist
          rm -f dist/videos_*.zip
          rsync -a ./ build/videos/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='tools/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='*.cache' \
            --exclude='videos_*.zip'
          cd build
          zip -q -r "../dist/${ARCHIVE}" videos
          cd ..
          unzip -t "dist/${ARCHIVE}"
          unzip -p "dist/${ARCHIVE}" videos/functions.inc | grep -Fq 'function VIDEOS_adminPageOpen'
          unzip -p "dist/${ARCHIVE}" videos/functions.inc | grep -Fq 'plugins/videos/interoperability.php'
          unzip -p "dist/${ARCHIVE}" videos/interoperability.php | grep -Fq 'function plugin_getfeednames_videos()'
          unzip -p "dist/${ARCHIVE}" videos/interoperability.php | grep -Fq 'function plugin_getfeedcontent_videos('
          unzip -p "dist/${ARCHIVE}" videos/interoperability.php | grep -Fq 'function plugin_getcapabilities_videos()'
          unzip -p "dist/${ARCHIVE}" videos/services.inc.php | grep -Fq 'function service_dashboard_summary_videos('
          unzip -p "dist/${ARCHIVE}" videos/autoinstall.php | grep -Fq "'config.videos.tab_seo'"
          if [ "${GITHUB_REF_NAME}" = '0.20.0' ]; then
            unzip -p "dist/${ARCHIVE}" videos/feed_update.php | grep -Fq 'function plugin_feedupdatecheck_videos('
            unzip -p "dist/${ARCHIVE}" videos/classes/Videos_ProviderFactory.php | grep -Fq 'class Videos_ProviderFactory'
            unzip -p "dist/${ARCHIVE}" videos/classes/Videos_TemplateRenderer.php | grep -Fq 'class Videos_TemplateRenderer'
            unzip -p "dist/${ARCHIVE}" videos/classes/Videos_CatalogueRenderer.php | grep -Fq 'class Videos_CatalogueRenderer'
            unzip -p "dist/${ARCHIVE}" videos/public_html/index.php | grep -Fq 'new Videos_CatalogueRenderer('
            unzip -p "dist/${ARCHIVE}" videos/templates/default/catalogue.thtml | grep -Fq '{grid}'
            unzip -p "dist/${ARCHIVE}" videos/templates/default/video-card.thtml | grep -Fq '{video_url}'
          fi
          if unzip -p "dist/${ARCHIVE}" videos/admin/actions.php | grep -Eq 'text_[0-9a-f]{12}|VIDEOS_adminText\('; then
            echo 'Legacy admin language reference found in archive.' >&2
            exit 1
          fi

      - name: Commit archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*define('VIDEOS_PLUGIN_VERSION', '\([^']*\)').*/\1/p" version.php | head -n 1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild Videos ${VERSION} archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
