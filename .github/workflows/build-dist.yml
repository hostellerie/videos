name: Build installable Videos archive

on:
  workflow_dispatch:
  push:
    branches:
      - 0.18.0
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

concurrency:
  group: videos-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Apply watch curation and moderation cleanup
        shell: bash
        run: |
          set -euo pipefail
          php tools/fix-watch-curation-and-moderation.php

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' -not -path './dist/*' -print0)

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="videos_0.18.0_2.1.1.zip"
          rm -rf build
          mkdir -p build/videos dist
          rm -f dist/videos_*.zip

          rsync -a ./ build/videos/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            --exclude='*.cache' \
            --exclude='videos_*.tar.gz' \
            --exclude='videos_*.zip'

          cd build
          zip -q -r "../dist/${ARCHIVE}" videos
          cd ..

          test -s "dist/${ARCHIVE}"
          unzip -t "dist/${ARCHIVE}"
          unzip -l "dist/${ARCHIVE}" | head -80

      - name: Commit corrected sources and archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="videos_0.18.0_2.1.1.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public_html admin language dist

          if git diff --cached --quiet; then
            echo "Sources and archive are already up to date."
            exit 0
          fi

          git commit -m "Fix watch curation and consolidate moderation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
